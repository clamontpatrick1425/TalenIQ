    <script>
      // Compatibility safeguard for iframe environments where window.fetch is a getter-only accessor
      try {
        if (typeof window !== 'undefined' && typeof window.fetch === 'function') {
          let _fetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _fetch;
            },
            set: function (fn) {
              _fetch = typeof fn === 'function' ? fn : _fetch;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        // Fallback silently if environment prevents property redefinition
      }
    </script>
